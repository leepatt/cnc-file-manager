<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}File Manager{% endblock %} · CNC File Manager</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="/static/design-system.css?v={{ static_version | default('1') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="site-header__brand">
      <span class="wordmark">CNC File Manager</span>
    </div>
    <div class="site-header__right">
      <div class="site-header__meta">
        {% block header_meta %}{% endblock %}
      </div>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    CNC File Manager · <span class="mono">{{ hostname | default('localhost') }}</span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
